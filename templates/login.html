<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Donia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="auth-container">
    <form class="auth-form" method="POST">
      <h1>Connexion</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <p class="auth-error">{{ messages[0] }}</p>
        {% endif %}
      {% endwith %}
      <input type="text" name="username" placeholder="Nom d'utilisateur" required autofocus />
      <input type="password" name="password" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
      <p class="auth-switch">Pas de compte ? <a href="{{ url_for('register') }}">S'inscrire</a></p>
      <p class="auth-credit">Créée par Rahim Batchabi</p>
    </form>
  </div>
</body>
</html>
